<style>
    * { box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      max-width: 500px; 
      margin: 0 auto; 
      padding: 15px; 
      
      /* REMOVIDA A IMAGEM - Fundo sólido escuro e limpo */
      background-color: #0f172a;
      color: #f8fafc; 
    }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header-bar h1 { font-size: 1.4rem; margin: 0; color: #ffffff; }
    .btn-admin-toggle { background: #1e293b; color: #fff; border: 1px solid #334155; font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .descricao-inicial {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 10px;
      background: #1e293b;
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 4px solid #3b82f6;
      border: 1px solid #334155;
    }

    .alerta-aviso {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background-color: #fef9c3;
      border: 1px solid #fde047;
      border-left: 4px solid #ca8a04;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: #713f12;
      line-height: 1.4;
    }

    /* CAIXA PRINCIPAL SÓLIDA */
    .box { 
      background: #ffffff; 
      color: #1e293b; 
      padding: 16px; 
      border-radius: 12px; 
      border: 1px solid #e2e8f0; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
    }

    .box h2 { color: #0f172a; margin-top: 0; }

    .field { margin-bottom: 15px; }
    label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 6px; color: #475569; }
    
    input[type="text"] { 
      width: 100%; 
      padding: 12px; 
      background: #ffffff;
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 0.95rem; 
      outline: none; 
      color: #0f172a;
    }
    input[type="text"]:focus { 
      border-color: #2563eb; 
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    button.btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    
    /* CARDS SÓLIDOS */
    .card { 
      background: #f8fafc; 
      border: 1px solid #e2e8f0; 
      padding: 10px; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin-top: 10px; 
      cursor: pointer; 
      transition: background 0.2s; 
      color: #0f172a;
    }
    .card:hover { background: #f1f5f9; }
    .card img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: #e2e8f0; }

    /* ABAS SÓLIDAS */
    .tabs-container { display: flex; border-bottom: 2px solid #e2e8f0; margin-top: 15px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #f1f5f9; cursor: pointer; font-weight: 600; color: #64748b; border-radius: 6px 6px 0 0; font-size: 0.9rem; }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-content { display: none; padding-top: 10px; }
    .tab-content.active { display: block; }

    /* PAINEL ADMIN */
    #painel-cadastro { 
      display: none; 
      border-color: #93c5fd; 
      background: #eff6ff; 
    }
    .admin-header h2 { color: #1e40af; }
    .btn-close { color: #64748b; }
    .hint { color: #64748b; }
    
    .btn-sugestao-publico { 
      background: #ffffff; 
      border: 1px dashed #2563eb; 
      color: #2563eb; 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 10px; 
      text-align: left; 
    }
    .sugestao-box { background: #fffbeb; border: 1px solid #fde68a; padding: 12px; border-radius: 8px; margin-top: 10px; color: #78350f; }
  </style>
