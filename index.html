<style>
    * { box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      max-width: 500px; 
      margin: 0 auto; 
      padding: 15px; 
      
      /* Fundo escuro sutil para garantir leitura */
      background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.65)), 
                  url('./fundo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff; 
    }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header-bar h1 { font-size: 1.4rem; margin: 0; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
    .btn-admin-toggle { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }

    .descricao-inicial {
      font-size: 0.9rem;
      color: #f1f5f9;
      line-height: 1.4;
      margin-bottom: 10px;
      background: rgba(15, 23, 42, 0.55);
      padding: 12px 14px;
      border-radius: 12px;
      border-left: 4px solid #3b82f6;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
    }

    .alerta-aviso {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background-color: rgba(254, 240, 138, 0.85);
      border: 1px solid rgba(254, 240, 138, 0.5);
      border-left: 4px solid #ca8a04;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: #713f12;
      line-height: 1.4;
      backdrop-filter: blur(8px);
    }

    /* CAIXAS PRINCIPAIS SOBREPOSTAS (VIDRO FOSCO) */
    .box { 
      background: rgba(255, 255, 255, 0.18); 
      color: #ffffff; 
      padding: 16px; 
      border-radius: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.25); 
      margin-bottom: 20px; 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .box h2 { color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-top: 0; }

    .field { margin-bottom: 15px; }
    label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 6px; color: #f1f5f9; }
    
    /* INPUT TRANSLÚCIDO */
    input[type="text"] { 
      width: 100%; 
      padding: 12px; 
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.4); 
      border-radius: 8px; 
      font-size: 0.95rem; 
      outline: none; 
      color: #0f172a;
    }
    input[type="text"]:focus { 
      background: #ffffff;
      border-color: #3b82f6; 
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
    }

    button.btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
    
    /* CARDS DE RESULTADOS TRANSLÚCIDOS */
    .card { 
      background: rgba(255, 255, 255, 0.25); 
      border: 1px solid rgba(255, 255, 255, 0.3); 
      padding: 10px; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin-top: 10px; 
      cursor: pointer; 
      transition: all 0.2s; 
      backdrop-filter: blur(6px);
      color: #ffffff;
    }
    .card:hover { 
      background: rgba(255, 255, 255, 0.35); 
      transform: translateY(-2px);
    }
    .card img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: #e2e8f0; }

    /* ABAS TRANSLÚCIDAS */
    .tabs-container { display: flex; border-bottom: 2px solid rgba(255, 255, 255, 0.2); margin-top: 15px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: rgba(255, 255, 255, 0.1); cursor: pointer; font-weight: 600; color: #cbd5e1; border-radius: 6px 6px 0 0; font-size: 0.9rem; }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-content { display: none; padding-top: 10px; }
    .tab-content.active { display: block; }

    /* PAINEL DE ADMIN TRANSLÚCIDO */
    #painel-cadastro { 
      display: none; 
      border-color: rgba(59, 130, 246, 0.5); 
      background: rgba(15, 23, 42, 0.85); 
    }
    .admin-header h2 { color: #60a5fa; }
    .btn-close { color: #94a3b8; }
    .hint { color: #cbd5e1; }
    
    .btn-sugestao-publico { 
      background: rgba(255, 255, 255, 0.15); 
      border: 1px dashed rgba(255, 255, 255, 0.5); 
      color: #ffffff; 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 10px; 
      text-align: left; 
      backdrop-filter: blur(4px);
    }
    .sugestao-box { background: rgba(254, 243, 199, 0.9); border: 1px solid #fde68a; padding: 12px; border-radius: 8px; margin-top: 10px; color: #78350f; }
  </style>
